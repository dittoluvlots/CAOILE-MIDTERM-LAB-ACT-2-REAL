<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Secure Dynamic Task Manager</h1>
        </header>

        <section class="task-input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Enter a task">
                <button id="addTaskBtn">Add Task</button>
            </div>
            <button id="loadSamplesBtn">Load Sample Tasks</button>
            <div id="taskMessage" class="message"></div>
        </section>

        <section class="task-summary-section">
            <div class="stat-card">
                <span class="stat-label">Total Tasks</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Pending</span>
                <span id="pendingCount" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Completed</span>
                <span id="completedCount" class="stat-value">0</span>
            </div>
        </section>

        <section class="task-list-section">
            <ul id="taskList"></ul>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
